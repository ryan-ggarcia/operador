# Produção na VPS: só a API (o banco é o Supabase e o front fica no Netlify),
# com o Caddy na frente cuidando do HTTPS. Variáveis em deploy/.env (fora do Git).
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    restart: unless-stopped

volumes:
  caddy:
